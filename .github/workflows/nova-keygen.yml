name: nova-keygen

# One-shot workflow: generates the Nova APT repository signing keypair.
#
#  1. Run this workflow manually (Actions -> nova-keygen -> Run workflow).
#  2. Download the `nova-gpg-key` artifact. It contains:
#       - nova-gpg-key.asc   (private key, ASCII-armored, no passphrase)
#       - nova-gpg-key.pub   (public key, ASCII-armored)
#       - nova-fingerprint.txt
#  3. Add TWO repository secrets (Settings -> Secrets and variables -> Actions):
#       NOVA_GPG_PRIVATE_KEY   = contents of nova-gpg-key.asc
#       NOVA_GPG_FINGERPRINT   = contents of nova-fingerprint.txt
#  4. Keep the downloaded key file in a password manager. Losing it = all
#     published packages become unusable.
#
# The key is generated ONCE. The build workflow (nova-build.yml) only imports
# NOVA_GPG_PRIVATE_KEY from secrets to sign, never generates a new key.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GPG key (RSA-4096, no passphrase, 5y)
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/gpghome"
          mkdir -p "${workdir}"
          chmod 700 "${workdir}"
          export GNUPGHOME="${workdir}"

          # %no-protection = no passphrase, so `--batch` never prompts for
          # input (the "can't get input" failure of --quick-generate-key).
          # NOTE: heredoc body must stay indented like every other line — the
          # block scalar strips the common indentation before bash sees it.
          cat > "${RUNNER_TEMP}/key.params" <<'EOF'
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: Eltayeb Hassan
          Name-Email: nova@smart.sd
          Expire-Date: 20y
          %no-protection
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --gen-key "${RUNNER_TEMP}/key.params"
          fpr="$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/{print $10; exit}')"
          echo "fingerprint=${fpr}" >> "${GITHUB_OUTPUT}"
          echo "${fpr}" > "${RUNNER_TEMP}/nova-fingerprint.txt"
          gpg --batch --armor --export "${fpr}" > "${RUNNER_TEMP}/nova-gpg-key.pub"
          gpg --batch --armor --export-secret-keys "${fpr}" > "${RUNNER_TEMP}/nova-gpg-key.asc"
          gpg --batch --output "${RUNNER_TEMP}/nova-gpg-key.gpg" --export "${fpr}"
          ls -l "${RUNNER_TEMP}/nova-gpg-key"*
          echo "Fingerprint: ${fpr}"

      - name: Upload key artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gpg-key
          path: |
            ${{ runner.temp }}/nova-gpg-key.asc
            ${{ runner.temp }}/nova-gpg-key.pub
            ${{ runner.temp }}/nova-gpg-key.gpg
            ${{ runner.temp }}/nova-fingerprint.txt
          if-no-files-found: error