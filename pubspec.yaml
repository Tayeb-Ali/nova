name: nova
description: "Nova IDE - mobile code editor with Termux run support."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod: ^3.4.3
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.1.1
  path: ^1.9.0
  file_picker: ^12.3.0
  path_provider: ^2.1.6
  xterm: ^4.0.0
  flutter_inappwebview: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.1
flutter:
  uses-material-design: true
