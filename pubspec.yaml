name: nova
description: "Nova IDE - mobile code editor with Termux run support."
publish_to: 'none'
version: 0.1.6+6
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod: ^3.4.3
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.1.1
  path: ^1.9.0
  file_picker: ^12.3.0
  path_provider: ^2.1.6
  xterm: ^4.0.0
  flutter_inappwebview: ^6.1.5
  google_fonts: ^8.2.1
  flutter_markdown: ^0.7.7+1
  fleather: ^1.28.0
  parchment: ^1.27.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: ^4.10.0
  pigeon: ^29.0.1
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/autocomplete/
    - assets/icon/

# Patrol E2E config (test-only; see integration_test/patrol_ruby_test.dart).
# Native setup (PatrolJUnitRunner + MainActivityTest) intentionally NOT added
# (android/ is off-limits); `patrol test` will report that gap if reached.
patrol:
  app_name: Nova
  test_directory: integration_test
  android:
    package_name: sd.adaa.codeide
